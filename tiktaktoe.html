<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tiktaktoe.css">
</head>
<body>

<div id="start-screen">
  <h1>Tic Tac Toe</h1>
  <input id="player1" placeholder="Player X name" />
  <input id="player2" placeholder="Player O name" />

  <button id="start-btn">Start Game</button>
</div>



<div id="game" class="hidden">

  <h1> Tik Tak Toe</h1>

  <div class="container">
    <div class="grid-container">
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
      <div id= "section" class="section"></div>
    </div>
  </div>

  <div class="player">
    <div class="player1">
      <p class="p1">Player X</p>
      <p class="p1-score">0</p>
    </div>
    <div class="player2">
      <p class="p2">Player O</p>
      <p class="p2-score">0</p>
    </div>
  </div>

  <div class="turn">
    <h1>Current Turn:</h1>
    <h1 id="p-turn"></h1>
  </div>

  <div class="button">
    <button>Reset Game</button>
  </div>

</div>

    <script src="tiktaktoe.js"></script>
</body>
</html>
